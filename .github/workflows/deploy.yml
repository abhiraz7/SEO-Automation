name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /opt/seo-automation",
              "sudo -u ec2-user git pull origin main",
              "sudo -u ec2-user bash -c \"cat > .env << EOF\nANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}\nSEMRUSH_API_KEY=${{ secrets.SEMRUSH_API_KEY }}\nDATAFORSEO_LOGIN=${{ secrets.DATAFORSEO_LOGIN }}\nDATAFORSEO_PASSWORD=${{ secrets.DATAFORSEO_PASSWORD }}\nWP_TOKEN_KEY=${{ secrets.WP_TOKEN_KEY }}\nEOF\"",
              "sudo -u ec2-user docker compose -f /opt/seo-automation/docker-compose.yml up -d --build",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
