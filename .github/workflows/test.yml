name: Tests

# Runs on every pull request, so a bad change is stopped before it can be merged
# (and, on a merge to main, deployed). It never deploys anything itself.
#
# "pytest" (this job) is a REQUIRED status check for main: a pull request whose
# tests are red or missing cannot be merged.
#
# Pull requests opened by another workflow with the built-in token (the plugin
# sync bot) get their Tests run held at "action_required" until an admin clicks
# "Approve and run workflows"; that approved run is what satisfies the required
# check. workflow_dispatch is only a convenience for running the tests by hand;
# a manually dispatched run does NOT satisfy the requirement for a pull request.
on:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Quoted on purpose: an unquoted 3.10 would be read by YAML as the number 3.1.
          # 3.12 matches the Dockerfile; requirements.txt says Python 3.10-3.12.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
